[project]
name = "orchestra-agent"
version = "0.1.0"
description = "AI Agent 流水线编排引擎（Temporal + 自研 DSL + MCP）"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Agent Orchestra Contributors"}]
dependencies = [
    "temporalio>=1.7.0",
    "pyyaml>=6.0",
    "jsonschema>=4.21.0",
    "jsonpath-ng>=1.6.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation>=0.45b0",
    "structlog>=24.1.0",
    "pydantic>=2.6.0",
    # 上界：0.4 起 celtypes 运行时类型由 CELBool/CELList 改名为 BoolType/ListType，
    # 0.5 沿用了新名。expr.py 已做双版本兼容，但锁上界以防 0.6 再变。
    "cel-python>=0.1.5,<0.6",
    "redis>=5.0.0",
    "aiosqlite>=0.20.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML",
    "types-jsonschema",
]

[project.scripts]
orchestra = "orchestra.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestra"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = [
    "E501",
    # 全文中文 docstring / 注释 / 文案是刻意的，全角标点不是「歧义字符」
    "RUF001",
    "RUF002",
    "RUF003",
    # Pydantic 模型字段直接用 DSL/YAML 的 camelCase 键名（model_dump 需保持线上格式），
    # 例如 ReviewGate.agentSelector / outputSchema，不能改成 snake_case
    "N815",
    # 项目统一使用 class X(str, Enum)；迁移到 enum.StrEnum 会改变 str() 语义，另行立项
    "UP042",
    # TimeoutError / A001 是 orchestra.domain.errors 的领域错误名，与内建同名是有意的
    "A004",
    "A001",
    # 领域错误分类是公开 API（design.md "错误分类总表"），名字不带 Error 后缀
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# 测试代码：嵌套 `async with env: async with worker:` 表达依赖层次更清晰；
# 局部常量按测试语义命名；需断言框架级 / 沙箱级宽泛异常
"tests/**" = ["N806", "B017", "SIM117"]
# conftest 需要先 sys.path.insert 再 import orchestra
"tests/conftest.py" = ["E402"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
exclude = ["tests/replay/fixtures"]

[[tool.mypy.overrides]]
module = ["temporalio.*", "jsonpath_ng.*", "celpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: pure unit tests (no IO)",
    "integration: requires Temporal dev server",
    "replay: replay compatibility tests",
    "chaos: chaos / failure injection",
    "load: throughput / latency baselines",
]

[tool.coverage.run]
source = ["src/orchestra"]

[tool.coverage.report]
# 仅排除「不可能被执行」的类型层代码，不排除任何业务分支
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",  # pipeline_base 的纯类型桩（运行时总被 Mixin 覆盖）
    'if __name__ == "__main__":',
]
