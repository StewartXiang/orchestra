name: CI

on:
  push:
    # master 是默认分支（此前只写 main/develop，导致 CI 从未触发）
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras
      - name: Ruff check
        run: uv run ruff check src tests
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: Mypy strict
        run: uv run mypy --strict src

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras
      - name: Validate JSON schemas parse
        run: |
          for f in schema/*.json; do
            uv run python -c "import json; json.load(open('$f'))" && echo "✓ $f"
          done
      - name: Validate examples against schema
        run: |
          for f in examples/*.pipeline.yaml; do
            uv run python -c "
          import yaml, json, jsonschema
          spec = yaml.safe_load(open('$f'))
          schema = json.load(open('schema/pipeline.schema.json'))
          jsonschema.validate(spec, schema)
          print('✓ $f')
          "
          done
      - name: Validate config files
        run: |
          uv run python -c "
          import yaml, json, jsonschema
          ps = yaml.safe_load(open('config/profiles.yaml'))
          schema = json.load(open('schema/agent-profile.schema.json'))
          jsonschema.validate(ps, schema)
          print('✓ config/profiles.yaml')
          "

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras
      - name: Pytest unit + integration (coverage)
        # 覆盖率口径 = unit + integration：workflows/CLI 等主要由集成测试覆盖，
        # 只量 tests/unit 会因为分层错配而长期达不到阈值（详见 CHANGELOG）。
        # chaos（故障注入）/ load（性能基线）不计入覆盖率。
        run: >
          uv run pytest tests/unit tests/integration -v
          --cov=src/orchestra --cov-report=xml --cov-report=term-missing
          --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  replay:
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # replay fixtures 可能存在 git LFS
      - uses: astral-sh/setup-uv@v3
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras
      - name: Pytest replay (Workflow 兼容性回归)
        run: uv run pytest tests/replay -v
        # Replay 失败必须修；如果是有意的不兼容变更，加 workflow.get_version() 兼容补丁

  integration:
    runs-on: ubuntu-latest
    needs: [unit]
    # 集成测试用 temporalio.testing.WorkflowEnvironment.start_time_skipping()
    # 在进程内跑真实 Workflow，**不需要外部 Temporal Server**，因此不再起
    # temporalio/auto-setup service container（它的 tctl 健康检查在该镜像里已不存在）。
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras
      - name: Pytest integration (in-process Temporal, mock Adapter)
        run: uv run pytest tests/integration -v -m integration

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose -f deploy/docker-compose.yml config > /dev/null
      - name: Validate Prometheus rules
        # 不能用 `uses: docker://prom/prometheus`：该镜像 ENTRYPOINT 是 /bin/prometheus，
        # args 会被当成 prometheus 的参数而不是 promtool 子命令。显式覆盖 entrypoint。
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/prometheus:/prometheus-rules:ro" \
            prom/prometheus:v2.51.0 check rules /prometheus-rules/alerts.yaml
